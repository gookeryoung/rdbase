# docker-compose：rdbase 全栈一键部署
# 用法：docker-compose up -d

services:
  # PostgreSQL 数据库（平台元数据存储）
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-rdbase}
      POSTGRES_USER: ${DB_USER:-rdbase}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rdbase_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rdbase}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis（缓存与会话后端）
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 后端 API（Django + gunicorn）
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_SETTINGS_MODULE: rdbase.settings.prod
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_NAME: ${DB_NAME:-rdbase}
      DB_USER: ${DB_USER:-rdbase}
      DB_PASSWORD: ${DB_PASSWORD:-rdbase_secret}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # 启动前执行迁移，然后启动 gunicorn
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn --bind 0.0.0.0:8000
                      --workers $${GUNICORN_WORKERS}
                      --worker-class uvicorn.workers.UvicornWorker
                      --timeout $${GUNICORN_TIMEOUT}
                      --graceful-timeout 30
                      --preload
                      --access-logfile -
                      --error-logfile -
                      rdbase.asgi:application"

  # 前端（nginx 托管静态文件 + API 反代）
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
