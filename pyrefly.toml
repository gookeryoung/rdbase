preset           = "strict"
project-excludes = [".venv/**", "template/**", "frontend/**", "backend/db/**", "backend/staticfiles/**"]
project-includes = ["**/*.ipynb", "**/*.py*"]
python-version   = "3.10"
search-path      = ["backend"]

# Django 项目类型推断误报降级为 warn：
# pyrefly 不识别 Django 模型字段描述符协议（CharField→str、DateTimeField→datetime）、
# 反向关系（field_mappings）、FK _id 属性、HttpResponse.json() 等。
# 这些在运行时由 Django 框架保证类型安全，降级为 warn 避免阻塞门禁同时保留可见性。
[errors]
bad-assignment = "warn"
bad-argument-type = "warn"
missing-attribute = "warn"
bad-override-mutable-attribute = "warn"
bad-override = "warn"
bad-context-manager = "warn"
unsupported-operation = "warn"
implicit-any-empty-container = "warn"
