[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies    = ["fastapi>=0.100.0", "uvicorn[standard]>=0.20.0"]
description     = "科研数据库。"
license         = "MIT"
name            = "rdbase"
readme          = "README.md"
requires-python = ">=3.8"
version         = "0.1.0"

[project.optional-dependencies]
dev = [
    "rdbase[lint,test]",
    "prek>=0.4.5",
    "tox-uv>=1.13.1",
    "tox>=4.25.0",
]
docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]
[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/rdbase"]

[tool.hatch.build.targets.wheel.force-include]
"src/rdbase/py.typed" = "rdbase/py.typed"

[tool.uv]
required-version = ">=0.5.0"

[[tool.uv.index]]
default = true
url     = "https://mirrors.aliyun.com/pypi/simple/"


[dependency-groups]
dev = ["rdbase[dev,docs]"]
