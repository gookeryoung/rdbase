[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "django>=5.2,<6.0",
    "django-ninja>=1.0",
    "django-cors-headers>=4.4",
    # 多数据库连接抽象层（连接外部 MySQL/PostgreSQL/SQLite）
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # 凭证加密
    "cryptography>=43.0",
    # Excel 读写（导入导出 openpyxl 流式）
    "openpyxl>=3.1",
    # JWT 认证（access/refresh 双 token）
    "pyjwt>=2.9",
    # Cron 表达式解析（同步任务定时调度计算 next_run_at）
    "croniter>=3.0",
    # ASGI/WSGI 服务器
    "uvicorn[standard]>=0.30",
    "gunicorn>=23.0",
    "scrapy>=2.17.0",
    "selectolax>=0.4.11",
    "feedparser>=6.0.14",
    "jsonpath-ng>=1.8.0",
    # 缓存与会话后端
    "redis>=5.0",
]
description = "通用数据库管理平台（django-ninja + React）."
license = { text = "MIT" }
name = "rdbase"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.optional-dependencies]
mysql = ["mysqlclient>=2.2"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "pytest>=8.0.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
    "prek>=0.4.5",
    "fakeredis>=2.20",
]

[tool.uv]
required-version = ">=0.5.0"

[[tool.uv.index]]
default = true
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.fspack]
# fspack 打包配置：生成 Windows .exe + NSIS 安装包
# 内置 _EXCLUDE 已排除 dist/build/__pycache__/.venv/tests/.git/*.md/docs 等
# 此处仅追加项目特有的排除模式
exclude = [
    "node_modules",
    "dbs",
    "backend/media",
]
# 注意：scrapy→parsel→lxml.etree 传递导入无法被 AST 分析追踪，
# 需在 Makefile fspack target 中用 --keep-module lxml.etree 保留

[tool.fspack.entries]
# 多入口：键=exe 名，值=入口脚本相对项目根的路径
rdbase = "backend/pack_main.py"
