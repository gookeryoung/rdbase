[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "django>=5.2,<6.0",
    "django-ninja>=1.0",
    "django-cors-headers>=4.4",
    # 多数据库连接抽象层（连接外部 MySQL/PostgreSQL/SQLite）
    "sqlalchemy>=2.0",
    "mysqlclient>=2.2",
    "psycopg[binary]>=3.2",
    # 凭证加密
    "cryptography>=43.0",
    # ASGI/WSGI 服务器
    "uvicorn[standard]>=0.30",
    "gunicorn>=23.0",
]
description = "通用数据库管理平台（django-ninja + React）."
license = { text = "MIT" }
name = "rdbase"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.optional-dependencies]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "pytest>=8.0.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
    "prek>=0.4.5",
]

[tool.uv]
required-version = ">=0.5.0"

[[tool.uv.index]]
default = true
url = "https://mirrors.aliyun.com/pypi/simple/"
